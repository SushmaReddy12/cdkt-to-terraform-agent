[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdkt"
version = "0.1.0"
description = "Agentic converter from AWS CDK source code to Terraform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8",
    "python-hcl2>=8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cdkt = "cdkt.cli:main"

[tool.setuptools.packages.find]
include = ["cdkt*"]

[tool.setuptools.package-data]
cdkt = ["knowledge/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
